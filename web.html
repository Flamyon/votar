<body>
<main id="app"><noscript>Esta página necesita JavaScript. No envía nada a ningún servidor.</noscript></main>
<footer id="pie"></footer>
<script>
"use strict";
const D = /*DATOS*/null;
const Q = D.preguntas, P = D.partidos;
const CLAVE = "afinidad-29n:v2", CLAVE_V1 = "afinidad-29n:respuestas";
// En la v2 estas afirmaciones pasaron a decir lo contrario (para equilibrar la redaccion): las respuestas v1 se invierten
const INVERTIDAS_V2 = ["DL1", "DL3", "V1", "S3", "S4", "T6", "T7", "X3", "X9", "X11", "M1", "K2"];
const CAMBIADAS_V2 = ["G5"];  // pregunta nueva con el mismo codigo: la respuesta v1 no vale
const REPO = "https://github.com/Flamyon/votar", X = "flamyonn";
// sugerencias y correcciones: un post en X dirigido a @flamyonn (nunca lleva las respuestas de quien lo usa)
const enX = texto => `https://x.com/intent/post?text=${encodeURIComponent(texto)}`;
const FECHA = new Date(D.actualizado + "T12:00:00").toLocaleDateString("es-ES", {day: "numeric", month: "long", year: "numeric"});
const AGREE = ["Muy en desacuerdo","En desacuerdo","Neutral","De acuerdo","Muy de acuerdo","Sin opinión"];
const DIL = ["Totalmente A","","Equilibrio","","Totalmente B","Sin opinión"];
const PESO = ["Me importa poco","Me importa","Puede decidir mi voto"];
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = v => v == null ? "—" : `${Math.round(100 * v)}%`;
const nombre = b => b.replace(/^[\d.]+\s*/, "");
const md = s => esc(s)
  .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
  .replace(/`([^`]+)`/g, "<code>$1</code>")
  .replace(/\[(\d+)\]/g, '<a class="ref" href="#f$1" data-f="f$1">[$1]</a>');

// calculo:inicio (misma formula que afinidad.py)
const MIN_BLOQUE = 3, MIN_COBERTURA = 0.6;
function valor(code, sinDudosos) {
  if (sinDudosos && code.endsWith("~")) return null;
  const v = code.replace(/~$/, "");
  return /^[1-5]$/.test(v) ? +v : null;
}
function afinidad(items) {
  const den = items.reduce((s, it) => s + it[0] * 4, 0);
  return den ? 1 - items.reduce((s, [p, a, x]) => s + p * Math.abs(a - x), 0) / den : null;
}
const conPeso = r => !!r && /^[1-5]$/.test(r.a) && /^[1-3]$/.test(r.p);
function calcular(preguntas, partidos, respuestas, sinDudosos) {
  const resp = preguntas.filter(q => conPeso(respuestas[q.id]));
  const totalW = resp.reduce((s, q) => s + +respuestas[q.id].p, 0);
  const res = {};
  for (const partido of partidos) {
    const items = [], bloques = {}, choques = [];
    for (const q of resp) {
      const x = valor(q.codigos[partido] ?? "?", sinDudosos);
      if (x === null) continue;
      const r = respuestas[q.id], it = [+r.p, +r.a, x];
      items.push(it);
      (bloques[q.bloque] ??= []).push(it);
      if (it[0] === 3 && Math.abs(it[1] - x) >= 3) choques.push({q, tu: it[1], ellos: x});
    }
    const orden = Object.entries(bloques).filter(([, v]) => v.length >= MIN_BLOQUE)
      .map(([b, v]) => [afinidad(v), b])
      .sort((x, y) => x[0] - y[0] || (x[1] < y[1] ? -1 : x[1] > y[1] ? 1 : 0));
    res[partido] = {
      global: afinidad(items),
      p3: afinidad(items.filter(it => it[0] === 3)),
      cobertura: totalW ? items.reduce((s, it) => s + it[0], 0) / totalW : 0,
      n: items.length,
      bloques: Object.fromEntries(Object.entries(bloques).map(([b, v]) => [b, afinidad(v)])),
      mejor: orden.length ? orden[orden.length - 1] : null,
      peor: orden.length ? orden[0] : null,
      choques,
    };
  }
  // primero los partidos con datos suficientes; los de poca cobertura, aparte
  const fiable = p => res[p].cobertura >= MIN_COBERTURA;
  const orden = [...partidos].sort((x, y) => (fiable(y) - fiable(x)) || (res[y].global ?? 0) - (res[x].global ?? 0));
  const bloques = [...new Set(resp.map(q => q.bloque))];
  return {res, orden, bloques, n: resp.length, fiables: orden.filter(fiable)};
}
// calculo:fin

// --- estado: solo en este navegador
let R = {}, guarda = true;
try {
  let x = JSON.parse(localStorage.getItem(CLAVE) || "null");
  const v1 = !x && JSON.parse(localStorage.getItem(CLAVE_V1) || "null");
  if (v1 && typeof v1 === "object") {
    x = v1;
    for (const id of INVERTIDAS_V2) if (x[id] && /^[1-5]$/.test(x[id].a)) x[id].a = String(6 - x[id].a);
    for (const id of CAMBIADAS_V2) delete x[id];
    localStorage.setItem(CLAVE, JSON.stringify(x));
    localStorage.removeItem(CLAVE_V1);
  }
  if (x && typeof x === "object" && !Array.isArray(x)) R = x;
} catch (e) { guarda = false; }
function persistir() {
  try { localStorage.setItem(CLAVE, JSON.stringify(R)); guarda = true; } catch (e) { guarda = false; }
}
const hecha = q => { const r = R[q.id]; return !!r && (r.a === "NS" || conPeso(r)); };
const nHechas = () => Q.filter(hecha).length;
function pendiente(desde) {
  const k = Q.findIndex((q, j) => j > desde && !hecha(q));
  return k >= 0 ? k : Q.findIndex(q => !hecha(q));
}

let i = Math.max(0, pendiente(-1)), st = {}, sinDudosos = false;
const vista = () => ["pregunta", "resultados"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "inicio";

function ir(v, k) {
  if (k !== undefined) i = Math.max(0, Math.min(k, Q.length - 1));
  st = {};
  if (vista() !== v) location.hash = v;  // hashchange pinta: el boton atras del movil funciona
  else { pintar(); window.scrollTo(0, 0); }
}
window.addEventListener("hashchange", () => { st = {}; pintar(); window.scrollTo(0, 0); });

// --- como esta hecho (inicio y resultados)
const lista = xs => xs.length > 1 ? `${xs.slice(0, -1).join(", ")} y ${xs[xs.length - 1]}` : xs.join("");
const enlace = (url, txt) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${txt}</a>`;
const corregir = q => `<a class="corr" href="${enX(`@${X} Sobre la pregunta ${q.id} del test de afinidad: `)}" target="_blank" rel="noopener noreferrer">¿Error? Dímelo en X</a>`;
function metodo() {
  const e = D.equilibrio, partidos = [...P].sort((x, y) => x.localeCompare(y, "es")).map(esc);
  return `<div class="faq">
  <p><b>Las preguntas.</b> ${Q.length} cuestiones del debate actual, en ${new Set(Q.map(q => q.bloque)).size} bloques. Están redactadas en los dos sentidos para que contestar «de acuerdo» a todo no te incline hacia un lado: en ${e.a} afirmaciones estar de acuerdo coincide más con PSOE, Sumar y Podemos; en ${e.b}, con PP y Vox; y ${e.neutras} no separan a esos dos bloques. En los dilemas, la opción A y la B también se reparten.</p>
  <p><b>Las posiciones de los partidos.</b> Cada partido está codificado en la misma escala de 1 a 5, con la base y la fuente a la vista en los resultados. Pesa más lo que ha votado y hecho (en el Congreso, en el Gobierno y en las comunidades donde gobierna) que lo que promete. Si un partido no tiene una posición clara en una pregunta, esa pregunta no cuenta para él; si hay poca evidencia, se marca con <code>~</code> y puedes dejarla fuera del cálculo.</p>
  <p><b>Los partidos.</b> ${lista(partidos)}: los de ámbito estatal con representación o con opciones reales. Los que solo se presentan en algunas comunidades (ERC, Junts, PNV, EH Bildu, BNG, Coalición Canaria…) no están porque cada partido exige documentar ${Q.length} posiciones con fuentes.</p>
  <p><b>Lo que no mide.</b> Corrupción, liderazgo, capacidad de gestión, pactos de gobierno o voto útil en tu provincia. El resultado dice cuánto coincides con cada partido en estas cuestiones, no a quién votar.</p>
  <p><b>Al día.</b> Posiciones revisadas el ${FECHA}. Los programas para el 29N aún no se han publicado: cuando salgan, se revisarán.</p>
  <p><b>Abierto.</b> El código y todas las posiciones son públicos en ${enlace(REPO, "GitHub")}. Si ves un error o echas algo en falta, escríbeme en X a ${enlace(`https://x.com/${X}`, `@${X}`)}; si es sobre la posición de un partido, mejor con la fuente.</p>
  </div>`;
}

// --- inicio
function vInicio() {
  const n = nHechas();
  return `<p class="kicker">Elecciones generales · 29 de noviembre de 2026</p>
  <h1>¿Con qué partido coincides?</h1>
  <p class="lead">${Q.length} afirmaciones sobre impuestos, vivienda, inmigración, instituciones, Europa y más. Tus respuestas se comparan con lo que cada partido ha votado y hecho, no solo con lo que promete, y cada posición lleva su fuente.</p>
  <div class="card">
    <ul class="pasos">
      <li><b>Responde</b> de 1 (muy en desacuerdo) a 5 (muy de acuerdo), o «sin opinión».</li>
      <li><b>Di cuánto te importa</b>, de 1 a 3. Lo que puede decidir tu voto pesa el triple que lo que te importa poco.</li>
      <li>Las afirmaciones están redactadas en ambos sentidos a propósito: contesta cada una por separado y lo que crees que es mejor, no lo que defiende «tu» partido.</li>
      <li><b>Unos 20-25 minutos.</b> Puedes parar cuando quieras${guarda ? ": el progreso se queda guardado en este navegador" : ""}.</li>
    </ul>
    <div class="row">${n
      ? `<button class="pri" data-go="seguir">${n < Q.length ? `Seguir (${n} de ${Q.length})` : "Revisar respuestas"}</button><button data-go="resultados">Ver resultados</button>`
      : `<button class="pri" data-go="empezar">Empezar</button>`}</div>
  </div>
  ${guarda ? "" : `<p class="aviso">Tu navegador no deja guardar el progreso: si cierras la pestaña, se pierde.</p>`}
  <p class="nota"><b>Privacidad.</b> No hay servidor, cuentas, cookies ni analítica. Tus respuestas no salen de tu dispositivo.${n ? ` <button class="link" data-go="borrar">Borrar mis respuestas</button>` : ""}</p>
  <details><summary><b>¿Cómo está hecho? ¿Está sesgado?</b></summary>${metodo()}</details>
  <p class="nota"><b>No es una recomendación de voto.</b> Es una comparación con un método explícito y fuentes a la vista; la decisión es tuya.</p>`;
}

// --- pregunta
function vPregunta() {
  const q = Q[i], r = R[q.id] || {}, n = nHechas();
  const a = st.a ?? r.a, p = st.p ?? r.p, paso = st.paso || "a";
  const dl = q.id.startsWith("DL");
  let labels = q.modo === "A" ? AGREE : dl ? DIL : null, texto = q.texto;
  if (!labels) {
    labels = ["", "", "", "", "", "Sin opinión"];
    for (const m of q.texto.matchAll(/(\d) = ([^·]+?)(?=\s*·|\.?$)/g)) labels[m[1] - 1] = m[2];
    texto = q.texto.split(/\s*1 = /)[0];
  }
  const bloques = [];
  Q.forEach((x, j) => {
    let b = bloques.find(z => z.id === x.bloque);
    if (!b) bloques.push(b = {id: x.bloque, primera: j, pendiente: -1, n: 0, h: 0});
    b.n++;
    if (hecha(x)) b.h++; else if (b.pendiente < 0) b.pendiente = j;
  });
  let h = `<div class="top"><button class="link" data-go="inicio">← Inicio</button><span>${n} de ${Q.length} respondidas</span>
    <select id="salto" aria-label="Ir a un bloque">${bloques.map(b => `<option value="${b.pendiente < 0 ? b.primera : b.pendiente}" ${b.id === q.bloque ? "selected" : ""}>${esc(nombre(b.id))} (${b.h}/${b.n})</option>`).join("")}</select></div>
  <div class="bar"><div style="width:${100 * n / Q.length}%"></div></div>
  <div class="card"><div class="sec">${esc(nombre(q.bloque))} · ${i + 1} de ${Q.length}${hecha(q) ? ' · <span class="ok">respondida</span>' : ""}</div>`;
  if (dl) {
    const m = q.texto.match(/^A: (.*?) B: (.*)$/) || ["", q.texto, ""];
    h += `<p class="q" tabindex="-1">¿Hacia dónde te inclinas?</p><div class="ab"><div><b>A</b>${esc(m[1])}</div><div><b>B</b>${esc(m[2])}</div></div>`;
  } else h += `<p class="q" tabindex="-1">${esc(texto)}</p>`;
  h += `<div class="lbl">${q.modo === "A" ? "¿Estás de acuerdo?" : "Tu posición"}</div><div class="row">` +
    ["1", "2", "3", "4", "5", "NS"].map((v, j) => `<button class="opt ${a === v ? "on" : ""} ${paso === "p" ? "dim" : ""}" data-a="${v}" aria-pressed="${a === v}"><span>${v}</span>${labels[j] ? `<small>${esc(labels[j])}</small>` : ""}</button>`).join("") +
    `</div><div class="lbl">¿Cuánto te importa?</div><div class="row">` +
    ["1", "2", "3"].map((v, j) => `<button class="opt ${p === v && a !== "NS" ? "on" : ""} ${paso === "a" ? "dim" : ""}" data-p="${v}" aria-pressed="${p === v}"><span>${v}</span><small>${PESO[j]}</small></button>`).join("") +
    `</div></div>
  <div class="nav"><button data-go="prev" ${i === 0 ? "disabled" : ""}>← Anterior</button><button data-go="next" ${i === Q.length - 1 ? "disabled" : ""}>Saltar →</button><button class="${n === Q.length ? "pri" : ""}" data-go="resultados">Ver resultados</button></div>
  <p class="hint">Atajos: <kbd>1</kbd>–<kbd>5</kbd> o <kbd>N</kbd> para responder y luego <kbd>1</kbd>–<kbd>3</kbd> para el peso · <kbd>Esc</kbd> vuelve atrás · <kbd>←</kbd> <kbd>→</kbd> para moverte · <kbd>Enter</kbd> guarda.</p>`;
  return h;
}
function elegirA(v) {
  st.a = v;
  if (v === "NS") responder(); else { st.paso = "p"; pintar(); }
}
function elegirP(v) {
  st.p = v;
  const a = st.a ?? (R[Q[i].id] || {}).a;
  if (!a || a === "NS") { st.paso = "a"; pintar(); } else responder();
}
function responder() {
  const q = Q[i], r = R[q.id] || {}, revisando = hecha(q);
  const a = st.a ?? r.a, p = st.p ?? r.p;
  if (!(a === "NS" || conPeso({a, p}))) return;
  R[q.id] = a === "NS" ? {a} : {a, p};
  persistir();
  const k = pendiente(i);
  if (k >= 0) ir("pregunta", k);
  else if (revisando && i < Q.length - 1) ir("pregunta", i + 1);
  else ir("resultados");
}

// --- resultados
const nivel = v => Math.min(5, 1 + Math.floor(v * 5));
const resumen = q => q.id.startsWith("DL") ? q.texto.replace(/^A: (.*?) B: (.*)$/, "A: $1 / B: $2") : q.texto;
function celda(q, code) {
  const r = R[q.id], x = valor(code, false);
  if (x === null) return `<td class="nd" title="Sin posición clara">?</td>`;
  if (sinDudosos && code.endsWith("~")) return `<td class="fuera" title="Poca evidencia: ignorada">${esc(code)}</td>`;
  const d = conPeso(r) ? Math.abs(+r.a - x) : null;
  const cls = d === 0 ? "cerca" : d >= 3 ? "lejos" : "";
  return `<td class="${cls}" ${code.endsWith("~") ? 'title="Poca evidencia"' : ""}>${esc(code)}</td>`;
}
function vResultados() {
  const n = nHechas(), {res, orden, bloques, fiables, n: nCalc} = calcular(Q, P, R, sinDudosos);
  let h = `<div class="top"><button class="link" data-go="inicio">← Inicio</button><button class="link" data-go="seguir">${n < Q.length ? `Seguir respondiendo (${n} de ${Q.length})` : "Revisar respuestas"}</button></div>
  <h1>Tus resultados</h1>`;
  if (!nCalc) return h + `<div class="card"><p>Todavía no hay ninguna respuesta con peso. Contesta algunas preguntas y vuelve aquí.</p><button class="pri" data-go="seguir">Responder</button></div>`;
  h += `<p class="lead">Cuánto coinciden tus ${nCalc} respuestas con la posición de cada partido («sin opinión» no cuenta). 100% sería coincidir en todo. Mide coincidencia en estas cuestiones, no te dice a quién votar.</p>`;
  if (n < Q.length) h += `<p class="aviso">Has respondido ${n} de ${Q.length}. Con más respuestas, el resultado es más fiable.</p>`;
  h += `<label class="check"><input type="checkbox" id="dudosos" ${sinDudosos ? "checked" : ""}> <span>Ignorar las posiciones con poca evidencia (<code>~</code>). Si el orden no cambia, el resultado es robusto.</span></label>`;

  const fila = p => {
    const r = res[p], w = r.global == null ? 0 : Math.round(100 * r.global);
    return `<li><div class="rk"><span class="pn">${esc(p)}</span><span class="pv">${pct(r.global)}</span></div>
      <div class="meter" title="${esc(p)}: ${pct(r.global)} de afinidad"><div style="width:${w}%"></div></div>
      <div class="sub">En lo que puede decidir tu voto: <b>${pct(r.p3)}</b> · Cobertura: ${pct(r.cobertura)} (${r.n} preguntas)${r.mejor ? ` · Mejor bloque: ${esc(nombre(r.mejor[1]))} (${pct(r.mejor[0])}) · Peor: ${esc(nombre(r.peor[1]))} (${pct(r.peor[0])})` : ""}</div></li>`;
  };
  const grupos = [];  // partidos seguidos en el ranking a menos de 3 puntos del siguiente
  fiables.forEach((p, k) => {
    if (k && res[fiables[k - 1]].global - res[p].global < 0.03) grupos[grupos.length - 1].push(p); else grupos.push([p]);
  });
  const juntos = grupos.filter(g => g.length > 1);
  const flojos = orden.filter(p => !fiables.includes(p));
  h += `<h2>Afinidad global</h2>`;
  if (fiables.length) h += `<ol class="rank">${fiables.map(fila).join("")}</ol>`;
  if (juntos.length) h += `<p class="nota"><b>Prácticamente empatados:</b> ${juntos.map(g => lista(g.map(esc))).join("; ")} (${juntos.some(g => g.length > 2) ? "cada uno a menos de 3 puntos del siguiente" : "a menos de 3 puntos"}). Codificar de otra forma unas pocas posiciones podría cambiar ese orden: tómalo como un empate.</p>`;
  if (flojos.length) h += `<h3 class="sub-h">Con datos insuficientes</h3><p class="nota">Solo tienen posición documentada en menos del 60% del peso de tus respuestas, así que su porcentaje no es comparable con el de los demás.</p><ol class="rank flojo">${flojos.map(fila).join("")}</ol>`;
  h += `<p class="nota">Cobertura: parte del peso de tus respuestas en la que el partido tiene una posición documentada.</p>`;

  h += `<h2>Por bloques</h2><div class="scroll"><table class="heat"><thead><tr><th scope="col">Bloque</th>${orden.map(p => `<th scope="col">${esc(p)}</th>`).join("")}</tr></thead><tbody>` +
    bloques.map(b => `<tr><th scope="row">${esc(nombre(b))}</th>${orden.map(p => {
      const v = res[p].bloques[b];
      return v == null ? `<td class="na" title="Sin posiciones documentadas">—</td>` : `<td class="h${nivel(v)}" title="${esc(nombre(b))} · ${esc(p)}: ${pct(v)}">${pct(v)}</td>`;
    }).join("")}</tr>`).join("") +
    `</tbody></table></div><div class="escala" aria-hidden="true"><span>0%</span><i class="h1"></i><i class="h2"></i><i class="h3"></i><i class="h4"></i><i class="h5"></i><span>100%</span></div>`;

  h += `<h2>Choques en lo que más te importa</h2><p class="nota">Preguntas con peso 3 en las que tu respuesta y la del partido se separan 3 puntos o más.</p>` +
    orden.map(p => {
      const cl = res[p].choques;
      if (!cl.length) return `<div class="fila"><b>${esc(p)}</b> · ninguno</div>`;
      return `<details><summary><b>${esc(p)}</b> · ${cl.length} choque${cl.length > 1 ? "s" : ""}</summary><ul class="choques">${cl.map(c =>
        `<li><span class="qid">${c.q.id}</span> ${esc(resumen(c.q))} <span class="vs">Tú ${c.tu}, ${esc(p)} ${c.ellos}</span><div class="base">${c.q.base ? `${md(c.q.base)} · ` : ""}${corregir(c.q)}</div></li>`).join("")}</ul></details>`;
    }).join("");

  let prev = "";
  h += `<h2>Pregunta a pregunta</h2><details><summary>Tu respuesta y la posición de cada partido, con su base</summary>
    <p class="nota">Verde: misma posición que tú. Rojo: a 3 puntos o más. <code>?</code>: sin posición clara (no cuenta). <code>~</code>: poca evidencia.</p>
    <div class="scroll"><table class="det"><thead><tr><th>Afirmación</th><th>Tú</th>${orden.map(p => `<th>${esc(p)}</th>`).join("")}</tr></thead><tbody>` +
    Q.map(q => {
      const r = R[q.id], tu = !r ? "—" : r.a === "NS" ? "NS" : conPeso(r) ? `${r.a} <small>·P${r.p}</small>` : "—";
      const g = q.bloque !== prev ? `<tr class="grupo"><th colspan="${orden.length + 2}">${esc(nombre(q.bloque))}</th></tr>` : "";
      prev = q.bloque;
      return `${g}<tr><td><span class="qid">${q.id}</span> ${esc(resumen(q))}<div class="base">${q.base ? `${md(q.base)} · ` : ""}${corregir(q)}</div></td><td>${tu}</td>${orden.map(p => celda(q, q.codigos[p] ?? "?")).join("")}</tr>`;
    }).join("") + `</tbody></table></div></details>`;

  h += `<h2>Cómo está hecho</h2><div class="card prose">
    <p><b>El cálculo.</b> La afinidad es <code>1 − Σ peso·|tú − partido| / Σ peso·4</code>, sobre las preguntas que has respondido y en las que el partido tiene una posición clara.</p>
    ${metodo()}
    <p style="margin-top:12px"><b>Notas de la codificación</b></p>
    <ul>${D.criterios.map(x => `<li>${md(x)}</li>`).join("")}</ul></div>
  <h2>Fuentes</h2><ol class="fuentes">${D.fuentes.map(f => `<li id="f${f.n}" value="${f.n}">${md(f.md)}</li>`).join("")}</ol>
  <div class="nav"><button data-go="seguir">Revisar respuestas</button><button data-go="imprimir">Imprimir o guardar en PDF</button><button class="peligro" data-go="borrar">Borrar mis respuestas</button></div>`;
  return h;
}

// --- pintar y eventos
function pintar() {
  const v = vista();
  app.innerHTML = v === "pregunta" ? vPregunta() : v === "resultados" ? vResultados() : vInicio();
  if (v === "pregunta" && !st.paso) app.querySelector(".q").focus({preventScroll: true});
}
const acciones = {
  inicio: () => ir("inicio"),
  empezar: () => ir("pregunta", 0),
  seguir: () => { const k = pendiente(-1); ir("pregunta", k >= 0 ? k : 0); },
  resultados: () => ir("resultados"),
  prev: () => ir("pregunta", i - 1),
  next: () => ir("pregunta", i + 1),
  imprimir: () => window.print(),
  borrar: () => {
    if (!confirm("¿Borrar todas tus respuestas de este navegador?")) return;
    R = {};
    try { localStorage.removeItem(CLAVE); } catch (e) {}
    i = 0;
    ir("inicio");
  },
};
app.addEventListener("click", e => {
  const ref = e.target.closest("a.ref");
  if (ref) {
    e.preventDefault();
    const el = document.getElementById(ref.dataset.f);
    if (el) { el.scrollIntoView({block: "center", behavior: "smooth"}); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1500); }
    return;
  }
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.a) elegirA(b.dataset.a);
  else if (b.dataset.p) elegirP(b.dataset.p);
  else if (acciones[b.dataset.go]) acciones[b.dataset.go]();
});
app.addEventListener("change", e => {
  if (e.target.id === "salto") ir("pregunta", +e.target.value);
  else if (e.target.id === "dudosos") { sinDudosos = e.target.checked; pintar(); }
});
document.addEventListener("keydown", e => {
  if (vista() !== "pregunta" || e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target, k = e.key, paso = st.paso || "a";
  if (t.tagName === "SELECT" || t.tagName === "INPUT") return;
  if (k === "ArrowLeft") ir("pregunta", i - 1);
  else if (k === "ArrowRight") ir("pregunta", i + 1);
  else if (paso === "a" && /^[1-5]$/.test(k)) elegirA(k);
  else if (paso === "a" && k.toLowerCase() === "n") elegirA("NS");
  else if (paso === "p" && /^[1-3]$/.test(k)) elegirP(k);
  else if (paso === "p" && (k === "Escape" || k === "Backspace")) { st.paso = "a"; pintar(); }
  else if (k === "Enter" && t.tagName !== "BUTTON") responder();
  else return;
  e.preventDefault();
});
document.getElementById("pie").innerHTML = `Proyecto personal de código abierto · Posiciones revisadas el ${FECHA} · ${enlace(REPO, "Código y fuentes en GitHub")} · Sugerencias y correcciones: ${enlace(`https://x.com/${X}`, `@${X} en X`)}`;
window.addEventListener("beforeprint", () => document.querySelectorAll("details").forEach(d => d.open = true));
pintar();
</script>
</body>
</html>
