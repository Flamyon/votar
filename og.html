<!doctype html>
<!-- Fuente de og.png, la imagen de la tarjeta al compartir el enlace (1200x630).

<html lang="es"><head><meta charset="utf-8"><title>og</title>
<style>
*{box-sizing:border-box}
body{margin:0;width:1200px;height:630px;background:#f5f4f0;color:#1d1d1f;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:56px 80px 52px;display:flex;flex-direction:column;overflow:hidden}
.k{margin-top:auto;font-size:24px;letter-spacing:.06em;text-transform:uppercase;color:#5f5f66}

p{font-size:32px;color:#5f5f66;margin:0}
.row{display:flex;gap:14px;margin-top:40px}
.o{flex:1;border:2px solid #dcdad3;background:#fff;border-radius:16px;padding:14px 20px;font-size:21px;line-height:1.25;color:#5f5f66}
.o b{display:block;font-size:34px;color:#1d1d1f}
.o.on{background:#256abf;border-color:#256abf;color:#e8f0fb}.o.on b{color:#fff}
.pie{margin-top:auto;display:flex;justify-content:space-between;font-size:24px;color:#5f5f66}
